name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    environment: quay
    uses: docker/github-builder/.github/workflows/build.yml@5f637c833aa76bc99372a1dc9a6f8bcd8056fb85 # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      distribute: true
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        quay.io/drangon/sonnet
        ghcr.io/drangon/sonnet
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
