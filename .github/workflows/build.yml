name: Build and Push

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      distribute: true
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: quay.io/drangon/sonnet
      meta-tags: |
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    secrets:
      registry-auths: |
        - registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
